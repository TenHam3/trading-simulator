syntax = "proto3";

package execution;

message Order {
    string symbol = 1;
    string side = 2;
    int32 quantity = 3;
}

message Fill {
    string symbol = 1;
    float price = 2;
    string side = 3;
    int32 quantity = 4;
}

message SubscribeRequest {}

service FillService {
    rpc GetFill (Order) returns (Fill) {}
    rpc StreamOrderFills (SubscribeRequest) returns (stream Fill) {}
}