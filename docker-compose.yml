# common.env
services:
  market_data:
    build:
      context: .
      dockerfile: ./services/market_data/Dockerfile
    env_file:
      - common.env
  strategy:
    build:
      context: .
      dockerfile: ./services/strategy/Dockerfile
    env_file:
      - common.env
    environment:
      - MKT_HOST=market_data
      - EX_HOST=execution
  execution:
    build:
      context: .
      dockerfile: ./services/execution/Dockerfile
    env_file:
      - common.env
    environment:
      - MKT_HOST=market_data
  portfolio:
    build:
      context: .
      dockerfile: ./services/portfolio/Dockerfile
    env_file:
      - common.env
    environment:
      - MKT_HOST=market_data
      - EX_HOST=execution